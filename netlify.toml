[build]
publish = "."
functions = "netlify/functions"

[[redirects]]
from = "/"
to = "/Schedule.html"
status = 200

[[redirects]]
from = "/api/google-calendar"
to = "/.netlify/functions/google-calendar"
status = 200

[[headers]]
for = "/sw.js"
  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/Schedule.html"
  [headers.values]
  Cache-Control = "no-cache, must-revalidate"
