/* ── Helpers ── */
const pad = n => String(Math.abs(n)).padStart(2,'0');
const BG_DAYS = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const CALENDAR_ENDPOINT = '/api/google-calendar';
const SCHEDULE_CACHE_KEY = 'kids-schedule.calendar-cache.v2';
const SELECTED_GROUP_KEY = 'kids-schedule.selected-group.v1';
const DEFAULT_CALENDAR_TIME_ZONE = 'Europe/Sofia';
function cloneChecklist(items = []) {
  return items.map(item => ({ ...item }));
}


function eventFromTemplate(kind, overrides = {}) {
  const template = TEMPLATE_BY_KIND[kind] || TEMPLATE_BY_KIND.default;
  const event = {
    kind,
    emoji: template.emoji,
    name: template.name,
    location: template.location,
    pageBg: template.pageBg,
    cardFrom: template.cardFrom,
    cardTo: template.cardTo,
    dark: !!template.dark,
    checklist: cloneChecklist(template.checklist),
    ...overrides,
  };

  if (overrides.location === undefined) event.location = template.location;
  if (overrides.checklist === undefined) event.checklist = cloneChecklist(template.checklist);
  if (overrides.dark === undefined) event.dark = !!template.dark;

  return event;
}

function toSec(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  return h * 3600 + m * 60;
}
function nowSec(now) {
  return now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
}

function formatTimeInZone(date, timeZone) {
  return new Intl.DateTimeFormat('bg-BG', {
    timeZone,
    hour: '2-digit',
    minute: '2-digit',
    hour12: false,
  }).format(date);
}


function formatDateInZone(date, timeZone) {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
  }).formatToParts(date);
  const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
  return `${values.year}-${values.month}-${values.day}`;
}

function isScheduleCacheUsable(cache) {
  return !!cache?.date && !!cache?.timeZone && Array.isArray(cache?.schedule);
}

function isScheduleCacheCurrent(cache, now = new Date()) {
  if (!isScheduleCacheUsable(cache)) return false;
  return cache.date === formatDateInZone(now, cache.timeZone);
}

function readStoredSchedule() {
  try {
    const cache = JSON.parse(localStorage.getItem(SCHEDULE_CACHE_KEY) || 'null');
    return isScheduleCacheUsable(cache) ? cache : null;
  } catch (error) {
    console.warn('Saved calendar schedule could not be read.', error);
    return null;
  }
}

function readCachedSchedule(now = new Date()) {
  const cache = readStoredSchedule();
  return isScheduleCacheCurrent(cache, now) ? cache : null;
}

function saveCachedSchedule(cache) {
  if (!isScheduleCacheCurrent(cache)) return;

  try {
    localStorage.setItem(SCHEDULE_CACHE_KEY, JSON.stringify(cache));
  } catch (error) {
    console.warn('Calendar schedule could not be saved for offline use.', error);
  }
}

function normalizeText(value = '') {
  return String(value).toLowerCase();
}

function parseGroups(value) {
  if (typeof value !== 'string') return [];
  return [...new Set(value.split(',').map(group => group.trim()).filter(Boolean))];
}

function groupsFromEvent(event) {
  const privateGroup = event?.extendedProperties?.private?.group;
  if (typeof privateGroup === 'string' && privateGroup.trim()) {
    return parseGroups(privateGroup);
  }

  const groupLine = String(event?.description || '').match(/^\s*(?:group|група)\s*:\s*(.+?)\s*$/im);
  return parseGroups(groupLine?.[1]);
}

function eventGroups(event) {
  if (Array.isArray(event?.groups)) return event.groups;
  // Keep schedules cached by versions before multi-group support working offline.
  return event?.group ? [event.group] : [];
}

function inferKind(summary = '', description = '', location = '') {
  const text = `${summary} ${description} ${location}`.toLowerCase();
  if (text.includes('лека нощ') || text.includes('good night') || text.includes('bedtime')) return 'bedtime';
  if (text.includes('добро утро') || text.includes('good morning') || text.includes('morning')) return 'morning';
  if (text.includes('следобедна') || text.includes('afternoon snack')) return 'snack';
  if (text.includes('обяд') || text.includes('lunch')) return 'lunch';
  if (text.includes('вечеря') || text.includes('dinner')) return 'dinner';
  if (text.includes('закуска') || text.includes('breakfast')) return 'breakfast';
  if (/разтяжк|stretch/.test(text)) return 'stretching';
  if (/суха|сфп|офп|off[- ]?ice|dry|gym|strength/.test(text)) return 'sfp';
  if (text.includes('лед') || text.includes('ice') || text.includes('skate') || text.includes('⛸')) return 'ice';
  return 'default';
}

function styleFromEvent(event) {
  const kind = inferKind(event.summary, event.description, event.location);
  const template = TEMPLATE_BY_KIND[kind] || TEMPLATE_BY_KIND.default;
  return eventFromTemplate(kind, {
    name: event.summary?.trim() || template.name,
    location: event.location ?? template.location,
  });
}

function calendarEventsToSchedule(events, timeZone) {
  return (events || [])
    .filter(ev => ev && ev.start?.dateTime)
    .map(ev => {
      const startDate = new Date(ev.start.dateTime);
      const styled = styleFromEvent(ev);
      return {
        time: formatTimeInZone(startDate, timeZone),
        groups: groupsFromEvent(ev),
        ...styled,
      };
    })
    .sort((a, b) => toSec(a.time) - toSec(b.time));
}

/* Returns index of current active (or next upcoming) event.
   Accounts for: natural time, half-time auto-advance, manual completions. */
function findHeroIdx(now, completed, schedule) {
  const ns = nowSec(now);

  // Last event that has started (or 0 if none yet)
  let candidate = 0;
  for (let i = 0; i < schedule.length; i++) {
    if (toSec(schedule[i].time) <= ns) candidate = i;
  }

  // Half-time auto-advance: if past the midpoint between this and next event, skip ahead
  if (candidate < schedule.length - 1) {
    const start = toSec(schedule[candidate].time);
    const end   = toSec(schedule[candidate + 1].time);
    if (ns >= start + (end - start) / 2) {
      candidate = candidate + 1;
    }
  }

  // Skip manually completed events
  while (candidate < schedule.length - 1 && completed.has(candidate)) {
    candidate++;
  }

  return candidate;
}

/* Returns diff in seconds: positive = upcoming, negative = elapsed since start */
function countdownDiff(now, idx, schedule) {
  return toSec(schedule[idx].time) - nowSec(now);
}

function formatDiff(diff) {
  const abs = Math.abs(Math.round(diff));
  const min = Math.floor(abs / 60);
  const sec = abs % 60;
  const sign = diff < 0 ? '−' : '';
  return `${sign}${pad(min)}:${pad(sec)}`;
}

/* ── useNow hook ── */
function useNow() {
  const [now, setNow] = useState(() => new Date());

  useEffect(() => {
    let timeoutId;

    const tick = () => {
      const next = new Date();
      setNow(next);
      timeoutId = window.setTimeout(tick, 1000 - next.getMilliseconds());
    };

    timeoutId = window.setTimeout(tick, 1000 - new Date().getMilliseconds());
    return () => window.clearTimeout(timeoutId);
  }, []);

  return now;
}

const StatusBar = memo(function StatusBar({ now, dark, groups = [], selectedGroup, onSelectGroup }) {

        <GroupPicker groups={groups} selectedGroup={selectedGroup}
          onSelect={onSelectGroup} dark={dark} />

});

/* ── CheckItem ── */
const CheckItem = memo(function CheckItem({ emoji, label, checked, index, onToggle, dark }) {
  const [pressing, setPressing] = useState(false);
  const handleToggle = useCallback(() => onToggle(index), [index, onToggle]);
  const unchBg    = dark ? 'oklch(1 0 0 / 0.10)' : 'oklch(1 0 0 / 0.55)';
  const chBg      = dark ? 'oklch(0.35 0.12 155 / 0.45)' : 'oklch(0.93 0.08 155)';
  const unchBord  = dark ? '1.5px solid oklch(1 0 0 / 0.20)' : '1.5px solid oklch(0.85 0.03 260)';
  const chBord    = dark ? '1.5px solid oklch(0.55 0.14 158 / 0.7)' : '1.5px solid oklch(0.65 0.14 158)';
  const textCol   = dark ? (checked ? 'oklch(0.72 0.14 158)' : 'oklch(0.92 0.03 280)') : (checked ? 'oklch(0.45 0.12 158)' : 'oklch(0.25 0.07 260)');
  const badgeBg   = dark ? 'oklch(0.55 0.14 158)' : 'oklch(0.62 0.16 158)';
  return (
    <button type="button" onClick={handleToggle}
      onPointerDown={() => setPressing(true)}
      onPointerUp={() => setPressing(false)}
      onPointerLeave={() => setPressing(false)}
      style={{
        background: checked ? chBg : unchBg,
        border: checked ? chBord : unchBord,
        borderRadius:R.lg, padding:`${S[3]}px ${S[2]}px`,
        display:'flex', flexDirection:'column', alignItems:'center', gap:S[1],
        cursor:'pointer', fontFamily:'inherit',

        transition:'transform 0.12s, background 0.18s',

      <div style={{ position:'relative', lineHeight:1 }}>
        <span style={{ fontSize:T.emojiCheck, lineHeight:1, display:'block',
          opacity: checked ? 0.55 : 1, filter: checked ? 'saturate(0.7)' : 'none',
          transition:'opacity 0.18s, filter 0.18s' }}>{emoji}</span>
        {checked && (
          <div style={{
            position:'absolute', right:-6, bottom:-4,
            width:20, height:20, borderRadius:'50%',
            background: badgeBg,
            display:'flex', alignItems:'center', justifyContent:'center',

            border: dark ? '2px solid oklch(0.22 0.07 278)' : '2px solid white',

        textDecoration: checked ? 'line-through' : 'none',

        letterSpacing:'-0.1px' }}>{label}</span>

});

/* ── HeroCard ── */
function HeroCard({ now, heroIdx, checks, onToggle, onComplete, theme, debugTimer, schedule }) {
  const ev      = schedule[heroIdx];
  const diff    = countdownDiff(now, heroIdx, schedule);
  // debugTimer override: 'обратно' = force upcoming, 'изминало' = force started
  const effectiveDiff = debugTimer === 'обратно' && diff < 0 ? 60
    : debugTimer === 'изминало' && diff >= 0 ? -60
    : diff;
  const started = effectiveDiff < 0;
  const accent  = (THEMES[theme] || THEMES.ice).accent;
  const isLast  = heroIdx === schedule.length - 1;
  const canComplete = !isLast && diff <= 0;
  const dark    = !!ev.dark;

  const absSec  = Math.abs(Math.round(effectiveDiff));
  const min     = Math.floor(absSec / 60);
  const sec     = absSec % 60;
  const bigSize = min >= 100 ? T.displaySmall : T.display;

  /* color tokens that flip for dark card */
  const titleCol   = dark ? 'oklch(0.95 0.04 282)' : 'oklch(0.18 0.07 260)';
  const metaCol    = dark ? 'oklch(0.62 0.06 280)' : 'oklch(0.50 0.05 260)';
  const timerBg    = dark ? 'oklch(1 0 0 / 0.07)' : 'oklch(0 0 0 / 0.05)';
  const labelCol   = started
    ? (dark ? 'oklch(0.78 0.18 30)' : 'oklch(0.62 0.20 25)')
    : (dark ? 'oklch(0.62 0.06 280)' : 'oklch(0.50 0.06 260)');
  const timerCol   = started
    ? (dark ? 'oklch(0.78 0.18 30)' : 'oklch(0.62 0.20 25)')
    : (dark ? 'oklch(0.92 0.05 282)' : 'oklch(0.25 0.12 258)');

  return (
    <div style={{
      margin:`${S[2]}px ${S[3]}px 0`, borderRadius:R.xxl, overflow:'hidden',
      background:`linear-gradient(160deg, ${ev.cardFrom} 0%, ${ev.cardTo} 100%)`,
      boxShadow:'0 8px 32px oklch(0.4 0.06 260 / 0.10)',
      position:'relative',
    }}>
      {/* faded emoji bg */}
      <div style={{
        position:'absolute', top:-10, right:10, fontSize:130, lineHeight:1,
        opacity:0.08, pointerEvents:'none', userSelect:'none', filter:'blur(2px)',
      }}>{ev.emoji}</div>

      <div style={{ padding:`${S[5]}px ${S[4]}px ${S[4]}px`, position:'relative' }}>

        {/* ① Event identity — left aligned */}
        <div style={{ display:'flex', alignItems:'center', gap:S[2], marginBottom:S[4] }}>
          <span style={{ fontSize:T.emojiHero, lineHeight:1, flexShrink:0 }}>{ev.emoji}</span>
          <div style={{ minWidth:0, flex:1 }}>
            <div style={{ fontSize:T.xl, fontWeight:W.dis, letterSpacing:'-0.5px',
                          lineHeight:1.15, color:titleCol, marginBottom:S[1] }}>{ev.name}</div>
            <div style={{ fontSize:T.md, fontWeight:W.reg, color:metaCol, letterSpacing:'-0.1px' }}>
              {ev.location ? `${ev.time} · ${ev.location}` : ev.time}
            </div>
          </div>
        </div>

        {/* ② Timer zone — centred pill */}
        <div style={{
          background: timerBg, borderRadius:R.xl, textAlign:'center',
          padding:`${S[3]}px ${S[4]}px ${S[2]}px`, marginBottom:S[3],
        }}>
          <div style={{
            fontSize:T.xs, fontWeight:W.em, letterSpacing:2.5,
            textTransform:'uppercase', color:labelCol, marginBottom:S[1],
          }}>
            {started ? 'Започна преди' : 'След'}
          </div>
          <div style={{ display:'flex', justifyContent:'center', alignItems:'baseline' }}>
            {/* mirror spacer + sign keep digits centred */}
            <span style={{ opacity: started ? 1 : 0, visibility: started ? 'visible' : 'hidden',
              fontSize:bigSize, fontWeight:W.dis, lineHeight:1, color:timerCol,
              marginRight:1, letterSpacing:0 }}>−</span>
            <span style={{ fontSize:bigSize, fontWeight:W.dis, lineHeight:1,
              letterSpacing:'-4px', fontVariantNumeric:'tabular-nums', color:timerCol,
              transition:'color 0.4s' }}>{`${pad(min)}:${pad(sec)}`}</span>
            <span style={{ visibility:'hidden',
              fontSize:bigSize, fontWeight:W.dis, lineHeight:1,
              marginLeft:1, letterSpacing:0 }}>−</span>
          </div>
        </div>

        {/* ③ Checklist */}
        {checks.length > 0 && (
          <div style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:S[2] }}>
            {checks.map((item, i) => (
              <CheckItem key={`${item.emoji}-${item.label}`} emoji={item.emoji} label={item.label}
                         checked={item.checked} index={i} onToggle={onToggle} dark={dark} />
            ))}
          </div>
        )}

        {/* ④ Готово */}
        {canComplete && <DoneButton onComplete={onComplete} accent={accent} />}
      </div>
    </div>
  );
}

const DoneButton = memo(function DoneButton({ onComplete, accent }) {
  const [pressing, setPressing] = useState(false);
  return (
    <button
      type="button"
      onClick={onComplete}
      onPointerDown={() => setPressing(true)}
      onPointerUp={() => setPressing(false)}
      onPointerLeave={() => setPressing(false)}
      style={{
        width:'100%', marginTop:S[3], padding:`${S[3]}px ${S[3]}px`,
        background: accent, border:'none',
        borderRadius:R.lg, color:'white',
        fontSize:T.md, fontWeight:W.em, letterSpacing:0.3,
        cursor:'pointer', fontFamily:'inherit',
        display:'flex', alignItems:'center', justifyContent:'center', gap:S[2],
        transform: pressing ? 'scale(0.97)' : 'scale(1)',
        opacity: pressing ? 0.85 : 1,
        transition:'transform 0.1s, opacity 0.1s',
        boxShadow:`0 4px 14px oklch(0 0 0 / 0.12)`,
      }}
    >
      <span>Готово</span>
      <span style={{ fontSize:T.md }}>✓</span>
    </button>
  );
});

/* ── EventList ── */
const EventList = memo(function EventList({ now, heroIdx, dark, schedule }) {
  const rowBg      = dark ? 'oklch(0.24 0.07 278)' : 'white';
  const textNorm   = dark ? 'oklch(0.85 0.04 280)' : 'oklch(0.22 0.06 258)';
  const textPast   = dark ? 'oklch(0.50 0.04 280)' : 'oklch(0.6 0.03 258)';
  const timePast   = dark ? 'oklch(0.42 0.04 280)' : 'oklch(0.65 0.03 258)';
  const timeNorm   = dark ? 'oklch(0.62 0.05 280)' : 'oklch(0.55 0.05 258)';
  const borderCur  = dark ? '3px solid oklch(0.62 0.12 280)' : '3px solid oklch(0.55 0.16 350)';
  const sectionCol = dark ? 'oklch(0.50 0.05 280)' : 'oklch(0.52 0.05 258)';
  return (
    <div style={{ padding:`${S[3]}px ${S[3]}px 0` }}>
      <div style={{ fontSize:T.xs, fontWeight:W.em, letterSpacing:2.5,
                    textTransform:'uppercase', color:sectionCol,
                    marginBottom:S[2], paddingLeft:S[1] }}>Днес</div>
      <div style={{ display:'flex', flexDirection:'column', gap:S[2] }}>
        {schedule.map((ev, i) => {
          const isPast    = i < heroIdx;
          const isCurrent = i === heroIdx;
          return (
            <div key={`${ev.time}-${ev.name}`} style={{
              background: rowBg, borderRadius:R.md, padding:`${S[3]}px ${S[3]}px`,
              display:'flex', alignItems:'center', gap:S[2],
              boxShadow: isCurrent
                ? (dark ? '0 4px 18px oklch(0.1 0.06 278 / 0.5)' : '0 4px 18px oklch(0.4 0.06 258 / 0.14)')
                : (dark ? 'none' : '0 2px 8px oklch(0.4 0.05 258 / 0.06)'),
              opacity: isPast ? 0.38 : 1,
              borderLeft: isCurrent ? borderCur : '3px solid transparent',
              transition:'opacity 0.3s',
            }}>
              <span style={{ fontSize:T.md, fontWeight:W.em,
                             color: isPast ? timePast : timeNorm,
                             minWidth:50, fontVariantNumeric:'tabular-nums' }}>{ev.time}</span>
              <span style={{ fontSize:T.emojiList, lineHeight:1 }}>{ev.emoji}</span>
              <span style={{ fontSize:T.lg, fontWeight:W.reg, flex:1, minWidth:0,
                             color: isPast ? textPast : textNorm,
                             textDecoration: isPast ? 'line-through' : 'none',
                             textDecorationColor: dark ? 'oklch(0.4 0.04 280)' : 'oklch(0.7 0.03 258)',
                             letterSpacing:'-0.2px' }}>{ev.name}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
});

const GroupPicker = memo(function GroupPicker({ groups, selectedGroup, onSelect, dark = false }) {
  const color = dark ? 'oklch(0.85 0.04 280)' : 'oklch(0.38 0.06 258)';
  const cycle = direction => {
    const currentIndex = Math.max(0, groups.indexOf(selectedGroup));
    onSelect(groups[(currentIndex + direction + groups.length) % groups.length]);
  };
  const arrowStyle = {
    border:'none', background:'transparent', color, padding:`${S[1]}px ${S[2]}px`,
    fontFamily:'inherit', fontSize:T.lg, fontWeight:W.dis, lineHeight:1,
    cursor:'pointer',
  };

  return (
    <div role="group" aria-label="Избери група" style={{
      display:'flex', alignItems:'center', color, minWidth:0,
    }}>
      <button type="button" aria-label="Предишна група" onClick={() => cycle(-1)} style={arrowStyle}>‹</button>
      <span aria-live="polite" style={{
        minWidth:64, maxWidth:130, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
        textAlign:'center', fontSize:T.sm, fontWeight:W.em,
      }}>{selectedGroup}</span>
      <button type="button" aria-label="Следваща група" onClick={() => cycle(1)} style={arrowStyle}>›</button>
    </div>
  );
});


const EmptySchedule = memo(function EmptySchedule({ now, status, message }) {
  const isLoading = status === 'loading';
  const title = isLoading ? 'Зареждам графика…' : 'Няма график за днес';
  const detail = message || (isLoading ? 'Свързвам се с календара.' : 'Свържи се с интернет, за да изтегля събитията.');

  return (
    <div style={{
      width:'100%', maxWidth:390, minHeight:'100dvh',
      background:'oklch(0.93 0.04 238)',
      display:'flex', flexDirection:'column', paddingBottom:40,
    }}>
      <StatusBar now={now} dark={false} />
      <main style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', padding:S[5] }}>
        <section style={{
          width:'100%', borderRadius:R.xxl, padding:S[6], textAlign:'center',
          background:'linear-gradient(135deg, oklch(0.89 0.07 240), oklch(0.96 0.03 228))',
          boxShadow:'0 24px 60px oklch(0.35 0.08 240 / 0.18)',
          color:'oklch(0.24 0.07 258)',
        }}>
          <div style={{ fontSize:64, lineHeight:1, marginBottom:S[4] }}>⛸️</div>
          <h1 style={{ fontSize:T.xl, fontWeight:W.dis, letterSpacing:'-0.4px', marginBottom:S[2] }}>{title}</h1>
          <p style={{ fontSize:T.md, fontWeight:W.reg, color:'oklch(0.40 0.06 258)', lineHeight:1.35 }}>{detail}</p>
        </section>
      </main>
    </div>
  );
});

/* ── App ── */
function ScheduleView({ now, schedule, groups, selectedGroup, onSelectGroup, t, setTweak, eventOpts, debugIdx }) {
  /* Per-event checklist state, keyed by event index */
  const [checkStates, setCheckStates] = useState({});

  // Manual completions: set of event indices the child marked done
  const [completed, setCompleted] = useState(new Set());

  useEffect(() => {
    setCompleted(new Set());
    setCheckStates({});
  }, [schedule]);

  const heroIdx = debugIdx >= 0 ? debugIdx : findHeroIdx(now, completed, schedule);

  const heroChecks = useMemo(() => {
    const base = schedule[heroIdx].checklist.map(item => ({ ...item, checked: false }));
    const saved = checkStates[heroIdx] || [];
    return base.map((item, i) => ({ ...item, checked: saved[i] ?? false }));
  }, [heroIdx, checkStates, schedule]);

  const toggleCheck = useCallback(i => {
    setCheckStates(prev => {
      const current = (prev[heroIdx] || schedule[heroIdx].checklist.map(() => false));
      const next = [...current];
      next[i] = !next[i];
      return { ...prev, [heroIdx]: next };
    });
  }, [heroIdx, schedule]);

  const handleComplete = useCallback(() => {
    if (nowSec(new Date()) < toSec(schedule[heroIdx].time)) return;
    setCompleted(prev => new Set([...prev, heroIdx]));
  }, [heroIdx, schedule]);

  /* Sync page + body bg and grid to current event */
  useEffect(() => {
    const ev = schedule[heroIdx];
    document.body.style.background = ev.pageBg;
    document.body.style.transition = 'background 0.6s ease';
    document.documentElement.style.setProperty('--grid-line',
      ev.dark
        ? 'oklch(0.30 0.05 278 / 0.5)'
        : 'oklch(0.88 0.03 55 / 0.35)'
    );
  }, [heroIdx, schedule]);

  const isDark = !!schedule[heroIdx].dark;

  return (
    <div style={{
      width:'100%', maxWidth:390, minHeight:'100dvh',
      background: schedule[heroIdx].pageBg,
      transition:'background 0.6s ease',
      display:'flex', flexDirection:'column',
      paddingBottom:40,
    }}>
      <StatusBar now={now} dark={isDark} groups={groups}
        selectedGroup={selectedGroup} onSelectGroup={onSelectGroup} />
      <HeroCard now={now} heroIdx={heroIdx} checks={heroChecks}
                onToggle={toggleCheck} onComplete={handleComplete}
                theme={t.accent} debugTimer={t.debugTimer} schedule={schedule} />
      <EventList now={now} heroIdx={heroIdx} dark={isDark} schedule={schedule} />

      <TweaksPanel>
        <TweakSection label="Акцент" />
        <TweakSelect label="Цвят" value={t.accent}
          options={['ice','aurora','sunset']}
          onChange={v => setTweak('accent', v)} />
        <TweakSection label="Дебъг" />
        <TweakSelect label="Събитие" value={t.debugEvent}
          options={eventOpts}
          onChange={v => setTweak('debugEvent', v)} />
        <TweakRadio label="Таймер" value={t.debugTimer}
          options={['авто','обратно','изминало']}
          onChange={v => setTweak('debugTimer', v)} />
      </TweaksPanel>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const now = useNow();
  const [initialCache] = useState(() => readCachedSchedule());
  const [schedule, setSchedule] = useState(() => initialCache?.schedule || []);
  const [scheduleStatus, setScheduleStatus] = useState(() => (initialCache?.schedule?.length ? 'offline-cache' : 'loading'));
  const [scheduleMessage, setScheduleMessage] = useState(() => (initialCache?.schedule?.length ? 'Показвам запазения график за днес, докато се обнови.' : ''));
  const [selectedGroup, setSelectedGroup] = useState(() => {
    try { return localStorage.getItem(SELECTED_GROUP_KEY) || ''; }
    catch (error) { return ''; }
  });

  useEffect(() => {
    const controller = new AbortController();

    async function loadCalendarSchedule() {
      setScheduleStatus(prev => (prev === 'local-cache' || prev === 'offline-cache' ? prev : 'loading'));
      try {
        const response = await fetch(CALENDAR_ENDPOINT, { signal: controller.signal, cache: 'no-store' });
        if (!response.ok) throw new Error(`Calendar request failed: ${response.status}`);
        const data = await response.json();
        const timeZone = data.timeZone || initialCache?.timeZone || DEFAULT_CALENDAR_TIME_ZONE;
        const mapped = calendarEventsToSchedule(data.events || [], timeZone);
        const cache = { date: data.date, timeZone, schedule: mapped, savedAt: new Date().toISOString() };

        if (data.ok && data.date === formatDateInZone(new Date(), timeZone)) {
          saveCachedSchedule(cache);
          setSchedule(mapped);
          setScheduleStatus(mapped.length ? 'online' : 'empty');
          setScheduleMessage(mapped.length ? '' : 'Няма събития за днес.');
        } else {
          const currentCache = readCachedSchedule();
          setSchedule(currentCache?.schedule || []);
          setScheduleStatus(currentCache ? 'offline-cache' : 'empty');
          setScheduleMessage(data.message || 'Календарът не е настроен.');
        }
      } catch (error) {
        if (error.name === 'AbortError') return;
        const currentCache = readCachedSchedule();
        if (currentCache) {
          setSchedule(currentCache.schedule);
          setScheduleStatus('offline-cache');
          setScheduleMessage('Показвам последно изтегления график за днес.');
        } else {
          setSchedule([]);
          setScheduleStatus('offline-empty');
          setScheduleMessage('Няма запазен график за днешната дата.');
        }
        console.warn('Calendar schedule could not be loaded.', error);
      }
    }

    loadCalendarSchedule();
    return () => controller.abort();
  }, []);

  const groups = useMemo(() => (
    [...new Set(schedule.flatMap(eventGroups))]
      .sort((a, b) => a.localeCompare(b, 'bg'))
  ), [schedule]);

  const activeGroup = groups.includes(selectedGroup) ? selectedGroup : (groups[0] || '');

  const visibleSchedule = useMemo(() => (
    schedule.filter(event => {
      const assignedGroups = eventGroups(event);
      return assignedGroups.length === 0 || assignedGroups.includes(activeGroup);
    })
  ), [schedule, activeGroup]);

  const selectGroup = useCallback(group => {
    setSelectedGroup(group);
    try { localStorage.setItem(SELECTED_GROUP_KEY, group); }
    catch (error) { console.warn('Selected group could not be saved.', error); }
  }, []);

  useEffect(() => {
    if (groups.length > 0 && selectedGroup !== activeGroup) {
      selectGroup(activeGroup);
    }
  }, [groups, selectedGroup, activeGroup, selectGroup]);

  // Debug overrides from Tweaks
  const eventOpts = useMemo(() => ['авто', ...visibleSchedule.map(ev => `${ev.time} ${ev.emoji}`)], [visibleSchedule]);
  const debugIdx = useMemo(() => (
    t.debugEvent !== 'авто'
      ? visibleSchedule.findIndex(ev => `${ev.time} ${ev.emoji}` === t.debugEvent)
      : -1
  ), [visibleSchedule, t.debugEvent]);

  useEffect(() => {
    if (t.debugEvent !== 'авто' && !eventOpts.includes(t.debugEvent)) {
      setTweak('debugEvent', 'авто');
    }
  }, [eventOpts, t.debugEvent, setTweak]);

  if (schedule.length === 0) {
    return (
      <>
        <EmptySchedule now={now} status={scheduleStatus} message={scheduleMessage} />
        <TweaksPanel>
          <TweakSection label="Акцент" />
          <TweakSelect label="Цвят" value={t.accent}
            options={['ice','aurora','sunset']}
            onChange={v => setTweak('accent', v)} />
        </TweaksPanel>
      </>
    );
  }

  return <ScheduleView now={now} schedule={visibleSchedule} groups={groups}
    selectedGroup={activeGroup} onSelectGroup={selectGroup}
    t={t} setTweak={setTweak} eventOpts={eventOpts} debugIdx={debugIdx} />;
}


if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(error => {
      console.warn('Service worker registration failed.', error);
    });
  });
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <React.StrictMode>
    <App />
  </React.StrictMode>,
);
</script>
